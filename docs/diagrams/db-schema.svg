      <line x1="328" y1="352" x2="632" y2="352" stroke="#2d3142" stroke-opacity="0.12" stroke-width="1"/>
      <text x="336" y="372" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" letter-spacing="0.14em">INDEXES</text>
      <text x="336" y="392" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace">users_mobile_phone_key · users_email_key</text>

