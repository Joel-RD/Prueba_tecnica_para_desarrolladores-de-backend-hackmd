      <rect x="420" y="287" width="28" height="12" rx="2" fill="none" stroke="#4f5d75" stroke-opacity="0.60" stroke-width="0.8"/>
      <text x="434" y="296" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">UQ</text>

      <text x="336" y="321" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif">email</text>
      <text x="624" y="321" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">varchar(65)</text>
