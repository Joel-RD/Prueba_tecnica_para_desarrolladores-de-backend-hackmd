      <text x="40" y="564" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>

      <rect x="124" y="550" width="28" height="12" rx="2" fill="none" stroke="#4f5d75" stroke-opacity="0.60" stroke-width="0.8"/>
      <text x="138" y="559" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">PK</text>
      <text x="160" y="564" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">PRIMARY KEY</text>

      <rect x="316" y="550" width="28" height="12" rx="2" fill="none" stroke="#4f5d75" stroke-opacity="0.60" stroke-width="0.8"/>
      <text x="330" y="559" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">UQ</text>
      <text x="352" y="564" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">UNIQUE</text>

      <rect x="472" y="550" width="28" height="12" rx="2" fill="none" stroke="#4f5d75" stroke-opacity="0.60" stroke-width="0.8"/>
      <text x="486" y="559" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">NN</text>
      <text x="508" y="564" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">NOT NULL</text>
