      <text x="354" y="113" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">TABLE</text>
      <text x="384" y="116" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif">public.users</text>

      <line x1="328" y1="136" x2="632" y2="136" stroke="#2d3142" stroke-opacity="0.12" stroke-width="1"/>

      <rect x="328" y="160" width="304" height="24" fill="#2d3142" fill-opacity="0.02"/>
