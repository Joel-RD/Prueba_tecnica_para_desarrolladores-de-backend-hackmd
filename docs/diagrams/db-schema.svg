      <rect x="356" y="143" width="28" height="12" rx="2" fill="none" stroke="#4f5d75" stroke-opacity="0.60" stroke-width="0.8"/>
      <text x="370" y="152" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">PK</text>

      <text x="336" y="177" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif">first_name</text>
      <text x="624" y="177" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">varchar(50)</text>

      <text x="336" y="201" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif">last_name</text>
      <text x="624" y="201" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">varchar(50)</text>

      <text x="336" y="225" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif">date_birth</text>
