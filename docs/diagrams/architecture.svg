      <title id="architecture-title">Arquitectura del backend de gestión de usuarios</title>
      <desc id="architecture-desc">Arquitectura de la API Express: el cliente envía peticiones HTTP en JSON a la API REST, los routers exponen las rutas /api/v1/users protegidas con JWT, el controlador valida, hashea contraseñas con bcrypt y persiste en la tabla users de PostgreSQL.</desc>
